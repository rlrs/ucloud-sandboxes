[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ucloud-sandboxes"
version = "0.5.23"
description = "Provider-aware gVisor sandbox control plane for Linux compute nodes"
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "boto3>=1.35,<2",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "urllib3>=2.2,<3",
]

[tool.uv]
exclude-newer = "2026-08-07T10:10:16.296145Z"

[project.scripts]
ucloud-sandboxes = "ucloud_sandboxes.cli:main"
ucloud-sandboxes-storage = "ucloud_sandboxes.storage_native_service:main"
ucloud-sandboxes-snapshot-gc = "ucloud_sandboxes.storage_native_s3_gc:main"
ucloud-sandboxes-registry-migrate = "ucloud_sandboxes.registry_storage_migration:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ucloud_sandboxes"]

[tool.hatch.build.targets.sdist]
exclude = ["/ucloud-sandboxes-sdk"]

[tool.ruff.lint]
select = ["C901", "E4", "E7", "E9", "F"]

[tool.ruff.lint.mccabe]
max-complexity = 70
